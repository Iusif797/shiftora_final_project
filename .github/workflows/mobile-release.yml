# =============================================================================
# shiftora — IT Enterprise mobile-release (GitHub Actions + fastlane match).
#
# Adapted from mobile-factory/.github/workflows/mobile-release.yml to the proven
# DMS/Mozkir pipeline (match CLI + xcodebuild manual distribution signing).
# shiftora specifics:
#   * Expo app lives in the `mobile/` subdirectory (working-directory: mobile)
#   * package manager is BUN (bun.lock) -> `bun install`, not npm ci
#   * bundle id / package = pro.itenterprise.shiftora  (author's existing appId, kept)
#   * match certs repo = GitHub IT-Enterprise-Solution/ios-certs  (NOT Gitea —
#     GitHub-hosted runners cannot reach the internal Gitea)
#   * ASC key #2372 (kid 7XC6RABHRH), Apple Team 8U2KKLXVSN
#
# Triggers are manual/tag only (never auto-runs on push). iOS archive REQUIRES
# the owner's one-time Apple steps first: register App ID pro.itenterprise.shiftora under
# Team 8U2KKLXVSN, create the App Store Connect app record, and run the first
# writable `fastlane match appstore` for pro.itenterprise.shiftora. Until then only the
# Android AAB job and the iOS compile-check can succeed.
name: mobile-release

on:
  workflow_dispatch:
    inputs:
      ios_archive:
        description: "Attempt signed iOS archive (needs App ID + ASC app record + match cert)?"
        type: boolean
        default: false
      upload_to_stores:
        description: "Upload to TestFlight / Play internal after build?"
        type: boolean
        default: false
  push:
    tags: ["v*"]

# No concurrency group: allow Android-focus and iOS runs to execute in parallel
# rather than serializing on main.

env:
  BUNDLE_ID: pro.itenterprise.shiftora
  APPLE_TEAM_ID: "8U2KKLXVSN"
  ASC_KEY_ID: "7XC6RABHRH"
  PROFILE_NAME: match AppStore pro.itenterprise.shiftora

jobs:
  # --- Cheap fail-fast gate: JS bundle must export before spending heavy
  #     Linux-gradle / macOS-Xcode runner minutes on the actual builds. ---
  bundle_check:
    name: Bundle check (expo export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install
      - name: expo export (iOS + Android JS bundle)
        run: |
          node -e "require.resolve('expo-asset')" || (echo "::error::expo-asset missing"; exit 1)
          bunx expo export --platform ios --output-dir .expo-export-ios
          bunx expo export --platform android --output-dir .expo-export-android

  # ---------------------------------------------------------------------------
  android:
    name: Android (signed AAB)
    # ukol #416: tato vetev slouzi VYHRADNE k Android/Play buildu.
    # Android job je znovu zapnuty; iOS job je naopak vypnuty (viz nize).
    needs: [bundle_check]
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.SHIFTORA_ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SHIFTORA_ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.SHIFTORA_ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.SHIFTORA_ANDROID_KEY_ALIAS }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      # ukol #416: bez tohohle sentry-cli sestreli task
      # ':app:createBundleReleaseJsAndAssets_SentryUpload_*' hlaskou
      # 'An organization ID or slug is required (provide with --org)'
      # a spadne cely gradle build. Tuhle opravu uz mel iOS job (commit 8d66aee,
      # ukol #341); Android job ji nemel, protoze byl od #341 vypnuty ('if: false')
      # a nikdo na to na Androidu nenarazil. eas.json profil production tuhle
      # promennou ma taky - proto EAS buildy prochazely a tenhle workflow ne.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      SENTRY_ALLOW_FAILURE: "true"
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install JS deps (bun)
        run: bun install
      - name: Preflight — expo-asset + export parses
        run: |
          node -e "require.resolve('expo-asset')" || (echo "::error::expo-asset missing — run 'bunx expo install expo-asset'"; exit 1)
          bunx expo export --platform android --output-dir .expo-export-check
      - name: Configure Gradle (bounded, single ABI)
        working-directory: .
        run: |
          mkdir -p "$HOME/.gradle"
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\norg.gradle.daemon=false\norg.gradle.parallel=false\norg.gradle.workers.max=2\nreactNativeArchitectures=arm64-v8a\n' > "$HOME/.gradle/gradle.properties"
      - name: Expo prebuild (android)
        run: bunx expo prebuild --platform android --no-install
      - name: Decode upload keystore
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shiftora-upload.jks"

      - name: Build signed AAB (jitpack vendored; single pass, generous timeout)
        if: env.ANDROID_KEYSTORE_B64 != ''
        timeout-minutes: 90
        working-directory: mobile/android
        run: |
          export VENDOR_MAVEN_REPO="$GITHUB_WORKSPACE/mobile/vendor-maven"
          # Cap native C++ (cmake/ninja) parallelism so concurrent cc1plus procs
          # don't exhaust the runner's RAM (the mid-compile-kill cause).
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          ./gradlew bundleRelease --no-daemon --stacktrace --max-workers=2 \
            --init-script "$GITHUB_WORKSPACE/mobile/vendor-maven.init.gradle" \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/shiftora-upload.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
      - name: Upload AAB artifact
        if: env.ANDROID_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: shiftora-android-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Upload to Play internal (guarded)
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.upload_to_stores) && env.ANDROID_KEYSTORE_B64 != '' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: pro.itenterprise.shiftora
          releaseFiles: mobile/android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft

  # ---------------------------------------------------------------------------
  ios:
    name: iOS (build + sign via match)
    # ukol #416: ShifTora build 12 je u Apple ve stavu WAITING_FOR_REVIEW.
    # Jakykoli novy iOS upload by submission stahnul -> iOS job je tvrde vypnuty.
    if: false
    needs: [bundle_check]
    runs-on: macos-latest # Xcode 26 / iOS 26 SDK (Apple TestFlight minimum); SDK 57 compiles here
    env:
      ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      # ukol #341: bez tohoto sentry-cli sestreli fazi "Bundle React Native code
      # and images" (hlasi 'An organization ID or slug is required --org') a padne
      # cely archiv. eas.json profil production ma tuto promennou taky — proto
      # EAS buildy 3-9 prosly a tenhle workflow ne.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      SENTRY_ALLOW_FAILURE: "true"
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install JS deps (bun)
        run: bun install
      - name: Preflight — expo-asset + export parses
        run: |
          node -e "require.resolve('expo-asset')" || (echo "::error::expo-asset missing"; exit 1)
          bunx expo export --platform ios --output-dir .expo-export-check
      - name: Show Xcode (macos-latest = Xcode 26 / iOS 26 SDK)
        run: xcodebuild -version
      - name: Expo prebuild (ios)
        run: bunx expo prebuild --platform ios --no-install
      - name: Patch Podfile — fix @sentry/react-native _SentryPrivate module (clean archive)
        run: |
          python3 - <<'PY'
          import re
          f = "ios/Podfile"
          s = open(f).read()
          snippet = (
            "\n    # CI fix: '@sentry/react-native' -> 'module _SentryPrivate not found' on clean archive.\n"
            "    installer.pods_project.targets.each do |t|\n"
            "      if t.name.start_with?('Sentry')\n"
            "        t.build_configurations.each do |c|\n"
            "          c.build_settings['DEFINES_MODULE'] = 'YES'\n"
            "          c.build_settings['CLANG_ENABLE_MODULES'] = 'YES'\n"
            "          c.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'\n"
            "        end\n"
            "      end\n"
            "    end\n"
          )
          m = re.search(r'post_install do \|installer\|\n', s)
          if not m:
              raise SystemExit("ERROR: no 'post_install do |installer|' block in Podfile")
          s = s[:m.end()] + snippet + s[m.end():]
          open(f, "w").write(s)
          print("Podfile post_install patched for Sentry")
          PY
        working-directory: mobile
      - name: CocoaPods install
        run: pod install --repo-update
        working-directory: mobile/ios
      - name: Discover workspace + scheme
        working-directory: mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1); BASE="${WS%.xcworkspace}"
          SCHEME=$(xcodebuild -list -workspace "$WS" -json | BASE="$BASE" python3 -c "import sys,json,os;s=json.load(sys.stdin)['workspace']['schemes'];b=os.environ['BASE'];print(b if b in s else next((x for x in s if x!='EASClient' and not x.startswith('Pods')), s[0]))")
          echo "IOS_WORKSPACE=mobile/ios/$WS" >> "$GITHUB_ENV"
          echo "IOS_SCHEME=$SCHEME" >> "$GITHUB_ENV"
      - name: Compile check (no signing) — always safe, needs no App ID
        working-directory: .
        run: |
          xcodebuild -workspace "$IOS_WORKSPACE" -scheme "$IOS_SCHEME" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            build CODE_SIGNING_ALLOWED=NO | tail -30
      # ---- Signed archive: only on explicit request AND after owner's Apple steps ----
      - name: fastlane match (appstore)
        id: match
        if: inputs.ios_archive
        working-directory: .
        run: |
          python3 - "$RUNNER_TEMP/asc_api_key.json" <<'PY'
          import os,json,sys,base64
          json.dump({"key_id":os.environ["ASC_KEY_ID"],"issuer_id":os.environ["ASC_ISSUER_ID"],
                     "key":base64.b64decode(os.environ["ASC_KEY_P8_B64"]).decode(),
                     "in_house":False,"duration":1200}, open(sys.argv[1],"w"))
          PY
          KC="$RUNNER_TEMP/build.keychain-db"; KP="$(openssl rand -base64 24)"; echo "::add-mask::$KP"
          security create-keychain -p "$KP" "$KC"; security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/\"//g')
          command -v fastlane >/dev/null || sudo gem install fastlane -N -q
          fastlane match appstore --app_identifier "$BUNDLE_ID" --team_id "$APPLE_TEAM_ID" \
            --storage_mode git --api_key_path "$RUNNER_TEMP/asc_api_key.json" --readonly true \
            --keychain_name "$KC" --keychain_password "$KP"
          echo "MATCH_KEYCHAIN=$KC" >> "$GITHUB_ENV"; echo "MATCH_KEYCHAIN_PW=$KP" >> "$GITHUB_ENV"
      - name: Archive + export signed IPA
        if: inputs.ios_archive && steps.match.outcome == 'success'
        working-directory: .
        run: |
          security unlock-keychain -p "$MATCH_KEYCHAIN_PW" "$MATCH_KEYCHAIN"
          set +e
          xcodebuild -workspace "$IOS_WORKSPACE" -scheme "$IOS_SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/shiftora.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $MATCH_KEYCHAIN" \
            CLANG_ENABLE_EXPLICIT_MODULES=NO \
            archive > "$RUNNER_TEMP/archive_full.log" 2>&1
          RC=$?
          if [ $RC -ne 0 ] || [ ! -d "$RUNNER_TEMP/shiftora.xcarchive" ]; then
            echo "===== ARCHIVE FAILED (rc=$RC) — error lines ====="
            grep -nE "error:|BUILD FAILED|The following build commands failed|Ld |Undefined symbol|CompileSwift|CompileC .*/normal/|PhaseScriptExecution|fatal error|not found|No such|clang" "$RUNNER_TEMP/archive_full.log" | tail -80
            echo "===== last 120 lines of archive log ====="; tail -120 "$RUNNER_TEMP/archive_full.log"
            exit 1
          fi
          set -e
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string><key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/shiftora.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" -exportPath "$RUNNER_TEMP/export" | tail -30
          ls -la "$RUNNER_TEMP/export"
      - name: Upload IPA artifact
        if: inputs.ios_archive && steps.match.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: shiftora-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn

      - name: Upload to TestFlight (ASC key #2372)
        if: inputs.ios_archive && inputs.upload_to_stores && steps.match.outcome == 'success'
        continue-on-error: true
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then echo "no IPA to upload"; exit 0; fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8_B64" | base64 -d > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tail -40
