name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Лёгкий Postgres для smoke-тестов /health и API.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shiftora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shiftora_test
      BETTER_AUTH_SECRET: test-secret-at-least-32-chars-long-xx
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bunx prisma db push --accept-data-loss
      - name: TypeCheck
        run: bun run typecheck
      - name: Smoke tests
        run: bun test --timeout 15000

  mobile-check:
    name: Mobile (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: TypeCheck
        run: npx tsc --noEmit
      - name: Lint
        # `expo lint` сам подтянет конфиг eslint-config-expo.
        run: npm run lint -- --max-warnings 0
        continue-on-error: true # warning'и пока не блокируют merge

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: backend-check
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: shiftora-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
