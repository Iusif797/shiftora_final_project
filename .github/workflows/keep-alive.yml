name: Keep backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -fsS --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            https://shiftora-final-project.onrender.com/health
